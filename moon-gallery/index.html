<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050303">
<title>Moonlit Memories – Polaroid Gallery</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="trail" aria-hidden="true"></div><div id="dot" aria-hidden="true"></div>

<header class="bar">
  <button id="modeBtn" title="Cinematic / bright mode">◐ Mode</button>
  <button id="shotBtn" title="Save a screenshot of the whole page">📷 Screenshot</button>
  <button id="vidBtn" title="Record this page with the music and download it as an MP4 video (rendered smoothly, no screen-share prompt)">⬇ Video</button>
  <button id="resetBtn" title="Remove all photos">Reset</button>
</header>

<div class="scene">
<main class="stage" id="stage">
  <div class="bg"></div>
  <div class="moonglow"></div><i class="tw" style="--x:737;--y:672"></i><i class="tw" style="--x:135;--y:1815;--d:-1.5s"></i><i class="tw" style="--x:225;--y:1215;--d:-.8s"></i>
  <figure class="frame" data-i="0" style="--x:745;--y:677;--w:388;--h:419;--capw:70%">
    <button class="slot" aria-label="Add photo to frame 1"><span class="add">+ Add Photo<small>tap or drop an image</small></span></button>
    <input class="cap" maxlength="40" placeholder="Add a caption…" aria-label="Caption for frame 1">
    <div class="tools"><button data-a="swap" aria-label="Swap photos">⇄</button><button data-a="replace" aria-label="Replace photo">↻</button><button data-a="dl" aria-label="Download photo">⬇</button><button data-a="rm" aria-label="Remove photo">✕</button></div>
  </figure>
  <figure class="frame" data-i="1" style="--x:380;--y:1126;--w:388;--h:415;--capw:78%">
    <button class="slot" aria-label="Add photo to frame 2"><span class="add">+ Add Photo<small>tap or drop an image</small></span></button>
    <input class="cap" maxlength="40" placeholder="Add a caption…" aria-label="Caption for frame 2">
    <div class="tools"><button data-a="swap" aria-label="Swap photos">⇄</button><button data-a="replace" aria-label="Replace photo">↻</button><button data-a="dl" aria-label="Download photo">⬇</button><button data-a="rm" aria-label="Remove photo">✕</button></div>
  </figure>
  <figure class="frame" data-i="2" style="--x:754;--y:1580;--w:364;--h:393;--capw:78%">
    <button class="slot" aria-label="Add photo to frame 3"><span class="add">+ Add Photo<small>tap or drop an image</small></span></button>
    <input class="cap" maxlength="40" placeholder="Add a caption…" aria-label="Caption for frame 3">
    <div class="tools"><button data-a="swap" aria-label="Swap photos">⇄</button><button data-a="replace" aria-label="Replace photo">↻</button><button data-a="dl" aria-label="Download photo">⬇</button><button data-a="rm" aria-label="Remove photo">✕</button></div>
  </figure>

  <section class="player" id="player" aria-label="Music player">
    <div class="art"><div class="eq"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
    <div class="meta"><b id="title">Moonlight</b><small id="sub">Track 1 / 3</small></div>
    <input id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="Seek">
    <div class="ctl">
      <button class="gbtn" id="pPrev" aria-label="Previous track">⏮</button>
      <button class="gbtn big" id="pPlay" aria-label="Play">▶</button>
      <button class="gbtn" id="pNext" aria-label="Next track">⏭</button>
    </div>
    <div class="volrow"><span aria-hidden="true">🔈</span><input id="vol" type="range" min="0" max="1" step="0.05" value="0.3" aria-label="Volume"></div>
    <label class="addsong">+ Add your own song<input type="file" id="songIn" accept="audio/*" hidden></label>
  </section>

</main>
</div>

<p class="help">Tap or click a frame to add a photo (or drop one on it) · ⇄ swaps the photos · swipe in the preview.</p>

<div id="modal" hidden role="dialog" aria-modal="true" aria-label="Photo preview">
  <button id="prev" aria-label="Previous photo">‹</button>
  <figure><img id="big" alt=""><figcaption id="bigCap"></figcaption></figure>
  <button id="next" aria-label="Next photo">›</button>
  <button id="close" aria-label="Close preview">✕</button>
  <a id="bigDl" class="dl" download="photo.jpg">⬇ Download</a>
</div>
<input type="file" id="file" accept="image/jpeg,image/png,image/webp" hidden>
<script src="scene-data.js"></script>
<script src="script.js"></script>
</body>
</html>
